name: CI
run-name: CI / ${{ github.event_name }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for setuptools_scm to derive version from git tags
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        # --locked fails the build if uv.lock is out of sync with pyproject.toml
        run: uv sync --locked --all-extras
      - name: Check formatting with ruff
        # Settings are configured within pyproject.toml [tool.ruff]
        run: uv run ruff format --check --diff .
      - name: Lint with ruff
        # Includes the flake8-bandit (S) security rules, see pyproject.toml [tool.ruff.lint]
        run: uv run ruff check --output-format=github .
      - name: Type check with ty
        # Settings are configured within pyproject.toml [tool.ty]
        run: uv run ty check --output-format=github
      - name: Run unit tests
        run: uv run pytest
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          flags: test-results
      - name: Build package
        run: uv build

  check:
    if: always()
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all builds passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build failed or was cancelled"
            exit 1
          fi
