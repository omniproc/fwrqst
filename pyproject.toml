[build-system]
requires = [
  "setuptools==84.2.1",
  "setuptools-scm         == 10.3.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "fwrqst"
dynamic = ['version']
description = "Lib for interacting with the Tufin API"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["python", "firewall", "tufin"]
license = { file = "LICENSE" }
authors = [{ name = "Robert Ruf", email = "fwrqst.hvgh7@silomails.com" }]

dependencies = [
  "pyyaml             == 6.0.3",  # YAML parser
  "httpx              == 0.28.1", # HTTP client
  "pydantic==2.14.1", # Data validation and management
  "dynaconf           == 3.3.5", # Settings management
  "platformdirs==4.13.5",  # Cross-platform directories
]

[project.optional-dependencies]
cli = [
  "typer==0.27.3", # CLI framework
]

[dependency-groups]
# PEP 735 dependency groups: development-only, never published as package extras.
# `uv sync` installs the `dev` group by default.
lint = [
  "ruff==0.16.10",  # Linting (incl. bandit security rules) and formatting
  "ty                 == 0.0.84",  # Static type checking
  "types-PyYAML       ~= 6.0",     # Type stubs for PyYAML
]
test = [
  "pytest             == 9.1.1",   # Unittests
  "pytest-cov         == 7.1.0",   # Coverage
  "pytest-mock==3.17.0",  # Mocking
  "pytest-httpx       == 0.36.2",  # HTTPX mocking
  "hypothesis==6.170.8", # Property-based testing
]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
]

[project.urls]
git = "https://github.com/omniproc/fwrqst/"
pypi = "https://pypi.org/project/fwrqst/"

[project.scripts]
fwrqst = "fwrqst.cli.main:start"

[tool.pytest.ini_options]
addopts = "-ra --cov=fwrqst --cov-report=term-missing --cov-report=xml --junitxml=junit.xml" # Add -q for less verbose output
testpaths = ["tests"]

[tool.setuptools]
platforms = ["any"]
include-package-data = true

[tool.setuptools.package-data]
fwrqst = ["*.schema.json"]

[tool.setuptools_scm]
# setuptools_scm is used to dynamically set the version number based on GIT metadata
version_scheme = "python-simplified-semver"
# Omit the local part of the version number (pypi doesn't support local versions)
local_scheme = "no-local-version"
# Fallback used when neither git metadata nor PKG-INFO from an sdist is available
# (e.g. shallow CI checkouts, GitHub source tarballs). Keeps `uv build`'s
# wheel-from-sdist step working even when setuptools_scm cannot detect a version.
fallback_version = "0.0.0"

[tool.uv]
# Minimum uv version for this project's lockfile and dependency groups. Keep this a
# loose floor rather than the latest release: Dependabot ships its own, slightly older uv.
required-version = ">=0.12"

[tool.ruff]
# The target Python version is inferred from `requires-python`
line-length = 127
src = ["src", "tests"]
extend-exclude = ["examples", "debug"]

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "S",   # flake8-bandit (replaces bandit)
]
ignore = [
  "E501", # line too long (handled by the formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# typer.Exit / SystemExit are control-flow signals; exception chaining adds nothing
"src/fwrqst/cli/**" = ["B904"]
# assert is the idiomatic pytest check; tests use dummy credentials
"tests/**" = ["S101", "S105", "S106"]

[tool.ty.environment]
# The target Python version is inferred from `requires-python`.
# Pin the project venv so the language server does not follow the editor's selected interpreter.
python = "./.venv"

[tool.ty.src]
include = ["src", "tests"]
